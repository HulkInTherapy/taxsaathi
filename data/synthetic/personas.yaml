    other_80c: 90000
    employers:
      - {name: Banyan Retail Pvt Ltd, monthly_gross: 130000, months: 8, start_month: 4, regime: old}
      - {name: Nimbus Softech Pvt Ltd, monthly_gross: 160000, months: 4, start_month: 12, regime: new}
    workflow: filing_prep
  - id: P25
    label: Income above ₹50 lakh (ITR-2, surcharge), salary only
    age: 47
    employers: [{name: Deccan Pharma Ltd, monthly_gross: 480000, regime: new}]
    interest: [{bank: Kaveri Bank Ltd, savings: 15000, fd: 90000}]
    workflow: filing_prep
  - id: P26
    label: Freelance designer, presumptive 44ADA (ITR-4)
    age: 32
    freelance: {receipts: 1800000, cash_over_5pct: false}
    interest: [{bank: Ganga Small Finance Bank, savings: 6500}]
    user_says: "I'm a freelance UI designer. My clients paid me ₹18 lakh in FY 2025-26, all by bank transfer. I don't keep detailed books. No salary."
    workflow: filing_prep
  - id: P27
    label: Freelance developer with FD, near ₹20 lakh GST threshold
    age: 34
    freelance: {receipts: 2400000, cash_over_5pct: false}
    interest: [{bank: Narmada Bank Ltd, fd: 58000}]
    user_says: "I'm a freelance software developer working for Indian startups. Total receipts ₹24 lakh this year, all online. Do I also need GST registration?"
    workflow: filing_prep
  - id: P28
    label: Small LTCG under ₹1.25 lakh stays in ITR-1
    age: 39
    employers: [{name: Tidewater Logistics Pvt Ltd, monthly_gross: 100000, regime: new}]
    itr_facts: {ltcg_112a: 90000}
    user_says: "I also redeemed some equity mutual funds held for 3 years, gain about ₹90,000."
    workflow: filing_prep

  # ---------------------------------------------------------------- E. tax-saving plans
  - id: P29
