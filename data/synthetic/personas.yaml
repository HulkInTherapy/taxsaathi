      - {name: Orchid Analytics LLP, monthly_gross: 120000, months: 5, start_month: 4, regime: new}
      - {name: Tidewater Logistics Pvt Ltd, monthly_gross: 150000, months: 7, start_month: 9, regime: new}
    interest: [{bank: Narmada Bank Ltd, savings: 4800}]
    workflow: filing_prep
  - id: P24
    label: Two employers, old then new regime choice
    age: 37
